# Inventaire du labo PentAGI.
#
# UN SEUL hôte : une VM/serveur Debian 12+ ou Ubuntu 22.04+ DÉDIÉ au labo,
# distinct de ton labo Proxmox sensible. C'est l'« hôte Docker du labo ».
#
# Remplace ansible_host par l'IP de ta VM dédiée, et l'utilisateur SSH.
# La clé SSH est pointée dans host_vars/pentagi-lab.yml (ou via --private-key).

[pentagi_lab]
pentagi-lab ansible_host=192.0.2.50 ansible_user=labadmin

[pentagi_lab:vars]
ansible_python_interpreter=/usr/bin/python3
