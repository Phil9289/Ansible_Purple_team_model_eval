---
- name: Cloner chaque VM du lab depuis le template
  community.proxmox.proxmox_kvm:
    api_host: "{{ vault_proxmox_api_host }}"
    validate_certs: false
    api_user: "{{ vault_proxmox_api_user }}"
    api_token_id: "{{ vault_proxmox_api_token_id }}"
    api_token_secret: "{{ vault_proxmox_api_token_secret }}"
    node: "{{ proxmox_node }}"
    clone: "{{ lab_template_name }}"
    newid: "{{ hostvars[item]['vmid'] }}"
    name: "{{ item }}"
    full: true
    storage: "{{ lab_storage }}"
    timeout: 300
  loop: "{{ groups['lab'] }}"
  no_log: true

- name: Agrandir le disque système scsi0 si supérieur à 20 Go
  community.proxmox.proxmox_disk:
    api_host: "{{ vault_proxmox_api_host }}"
    validate_certs: false
    api_user: "{{ vault_proxmox_api_user }}"
    api_token_id: "{{ vault_proxmox_api_token_id }}"
    api_token_secret: "{{ vault_proxmox_api_token_secret }}"
    vmid: "{{ hostvars[item]['vmid'] }}"
    disk: scsi0
    size: "{{ hostvars[item]['disk_gb'] }}G"
    state: resized
  loop: "{{ groups['lab'] }}"
  when: hostvars[item]['disk_gb'] | int > 20
  no_log: true

- name: Lire l'état de chaque VM (une VM allumée ne doit pas être reconfigurée à chaud)
  community.proxmox.proxmox_vm_info:
    api_host: "{{ vault_proxmox_api_host }}"
    validate_certs: false
    api_user: "{{ vault_proxmox_api_user }}"
    api_token_id: "{{ vault_proxmox_api_token_id }}"
    api_token_secret: "{{ vault_proxmox_api_token_secret }}"
    node: "{{ proxmox_node }}"
    vmid: "{{ hostvars[item]['vmid'] }}"
  loop: "{{ groups['lab'] }}"
  register: vm_info
  no_log: true

- name: Repérer les VM déjà allumées
  ansible.builtin.set_fact:
    running_vms: "{{ vm_info.results | selectattr('proxmox_vms.0.status', 'equalto', 'running') | map(attribute='item') | list }}"

- name: Configurer ressources, réseau vmbr3 et cloud-init (VM éteintes seulement)
  community.proxmox.proxmox_kvm:
    api_host: "{{ vault_proxmox_api_host }}"
    validate_certs: false
    api_user: "{{ vault_proxmox_api_user }}"
    api_token_id: "{{ vault_proxmox_api_token_id }}"
    api_token_secret: "{{ vault_proxmox_api_token_secret }}"
    node: "{{ proxmox_node }}"
    vmid: "{{ hostvars[item]['vmid'] }}"
    name: "{{ item }}"
    cores: "{{ hostvars[item]['vcpu'] }}"
    memory: "{{ hostvars[item]['ram_mb'] }}"
    net:
      net0: "virtio,bridge={{ lab_bridge }},firewall=0"
    ipconfig:
      ipconfig0: "ip={{ hostvars[item]['ansible_host'] }}/24,gw={{ lab_gateway }}"
    nameservers:
      - "{{ lab_dns }}"
    ciuser: "{{ ansible_svc_user }}"
    sshkeys: "{{ lookup('file', lab_ssh_pubkey) }}"
    update: true
    update_unsafe: true
  loop: "{{ groups['lab'] }}"
  when: item not in running_vms
  no_log: true

- name: Vérifier que le stockage local accepte les snippets (hookscript)
  ansible.builtin.command: pvesm status --content snippets
  register: snippets_storage
  changed_when: false
  delegate_to: "{{ groups['proxmox_host'][0] }}"
  connection: ssh
  when: gpu_passthrough | bool

- name: Arrêter si le stockage local n'accepte pas les snippets
  ansible.builtin.assert:
    that: "'local ' in snippets_storage.stdout"
    fail_msg: >-
      Le stockage 'local' n'accepte pas les snippets. Sur le Proxmox, une seule fois :
      pvesm set local --content "$(pvesm config local | awk '/content/{print $2}'),snippets"
  when: gpu_passthrough | bool

- name: Déployer le hookscript de partage de la P100 sur le Proxmox
  ansible.builtin.template:
    src: p100-hook.sh.j2
    dest: "{{ gpu_hookscript_path }}"
    mode: "0755"
  delegate_to: "{{ groups['proxmox_host'][0] }}"
  connection: ssh
  when: gpu_passthrough | bool

- name: Lire la configuration actuelle de la VM agent
  ansible.builtin.command: "qm config {{ hostvars[groups['attacker'][0]]['vmid'] }}"
  register: agent_qm_config
  changed_when: false
  delegate_to: "{{ groups['proxmox_host'][0] }}"
  connection: ssh
  when: gpu_passthrough | bool

- name: Attacher la P100 à la VM agent (q35 + mapping + hookscript, VM éteinte seulement)
  ansible.builtin.command: >-
    qm set {{ hostvars[groups['attacker'][0]]['vmid'] }}
    --machine q35
    --hostpci0 mapping={{ gpu_pci_mapping }},pcie=1
    --hookscript {{ gpu_hookscript }}
  delegate_to: "{{ groups['proxmox_host'][0] }}"
  connection: ssh
  when:
    - gpu_passthrough | bool
    - groups['attacker'][0] not in running_vms
    - >-
      ("mapping=" ~ gpu_pci_mapping) not in agent_qm_config.stdout
      or ("hookscript: " ~ gpu_hookscript) not in agent_qm_config.stdout
      or "machine: q35" not in agent_qm_config.stdout

- name: Démarrer chaque VM du lab
  community.proxmox.proxmox_kvm:
    api_host: "{{ vault_proxmox_api_host }}"
    validate_certs: false
    api_user: "{{ vault_proxmox_api_user }}"
    api_token_id: "{{ vault_proxmox_api_token_id }}"
    api_token_secret: "{{ vault_proxmox_api_token_secret }}"
    node: "{{ proxmox_node }}"
    vmid: "{{ hostvars[item]['vmid'] }}"
    state: started
    timeout: 300
  loop: "{{ groups['lab'] }}"
  no_log: true
