---
- name: Installer les outils de l'attaquant
  ansible.builtin.apt:
    name: "{{ attacker_tools }}"
    state: present
    update_cache: "{{ apt_update_cache | default(true) | bool }}"
    cache_valid_time: 3600

- name: Créer le répertoire de Hermes
  ansible.builtin.file:
    path: "{{ hermes_dir }}"
    state: directory
    owner: "{{ ansible_svc_user }}"
    group: "{{ ansible_svc_user }}"
    mode: "0755"

- name: Moteur local (llama.cpp dans la VM)
  ansible.builtin.import_tasks: local_llm.yml
  when: llm_backend | default('local') == 'local'

- name: Moteur Strata (via la passerelle) — plus de llama-server local
  ansible.builtin.import_tasks: strata.yml
  when: llm_backend | default('local') == 'strata'

- name: Déployer le script de l'agent Hermes
  ansible.builtin.template:
    src: hermes_agent.py.j2
    dest: "{{ hermes_dir }}/hermes_agent.py"
    owner: "{{ ansible_svc_user }}"
    group: "{{ ansible_svc_user }}"
    mode: "0755"

- name: Déployer la configuration de Hermes (peut contenir une clé API, d'où 0600)
  ansible.builtin.template:
    src: hermes.env.j2
    dest: "{{ hermes_dir }}/hermes.env"
    owner: "{{ ansible_svc_user }}"
    group: "{{ ansible_svc_user }}"
    mode: "0600"

- name: Déployer le service systemd hermes-agent (mission unique, lancée à la demande)
  ansible.builtin.template:
    src: hermes-agent.service.j2
    dest: /etc/systemd/system/hermes-agent.service
    owner: root
    group: root
    mode: "0644"
  notify: Recharger systemd

- name: Appliquer tout de suite le rechargement de systemd
  ansible.builtin.meta: flush_handlers

- name: Lancer une mission Hermes (seulement si hermes_run_on_deploy est vrai)
  ansible.builtin.systemd:
    name: hermes-agent
    state: started
  when: hermes_run_on_deploy | bool
