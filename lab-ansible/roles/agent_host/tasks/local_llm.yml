---
# Moteur local : llama.cpp + modèle GGUF dans la VM agent (llm_backend: local).
- name: Créer les répertoires nécessaires pour llama et hermes
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ ansible_svc_user }}"
    group: "{{ ansible_svc_user }}"
    mode: "0755"
  loop:
    - "{{ llama_install_dir }}"
    - "{{ llama_models_dir }}"
    - /opt/hermes

- name: Télécharger et extraire la version complète de llama.cpp (binaire + libs)
  ansible.builtin.unarchive:
    src: "{{ llama_release_url }}"
    dest: "{{ llama_install_dir }}"
    remote_src: true
    extra_opts:
      - --strip-components=1
    creates: "{{ llama_install_dir }}/llama-server"
    owner: "{{ ansible_svc_user }}"
    group: "{{ ansible_svc_user }}"
  when: llama_backend != 'cuda'

# Le GPU d'abord : gpu.yml ajoute les dépôts non-free et le pilote,
# dont cuda.yml a besoin (nvidia-cuda-toolkit vient de non-free).
- name: Préparer le GPU (pilote NVIDIA + Vulkan) si la P100 est attachée
  ansible.builtin.import_tasks: gpu.yml
  when: gpu_passthrough | bool

- name: Compiler llama.cpp avec CUDA si llama_backend vaut cuda
  ansible.builtin.import_tasks: cuda.yml
  when: llama_backend == 'cuda'

- name: Vérifier si le modèle est présent dans le cache du nœud de contrôle
  ansible.builtin.stat:
    path: "{{ llm_model_cache_dir }}/{{ llm_model_name }}"
    get_checksum: false
  delegate_to: localhost
  become: false
  register: llm_cache

- name: Copier le modèle depuis le cache local du contrôleur (hors-ligne)
  ansible.builtin.copy:
    src: "{{ llm_model_cache_dir }}/{{ llm_model_name }}"
    dest: "{{ llama_models_dir }}/{{ llm_model_name }}"
    owner: "{{ ansible_svc_user }}"
    group: "{{ ansible_svc_user }}"
    mode: "0644"
  when: llm_cache.stat.exists
  notify: Redémarrer llama-server

- name: Télécharger le modèle depuis Hugging Face (repli si le cache est absent)
  ansible.builtin.get_url:
    url: "{{ llm_model_url }}"
    dest: "{{ llama_models_dir }}/{{ llm_model_name }}"
    owner: "{{ ansible_svc_user }}"
    group: "{{ ansible_svc_user }}"
    mode: "0644"
    timeout: 600
    tmp_dest: "/var/tmp"
  when: not llm_cache.stat.exists
  notify: Redémarrer llama-server

- name: Déployer le service systemd pour llama-server
  ansible.builtin.template:
    src: llama-server.service.j2
    dest: /etc/systemd/system/llama-server.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Recharger systemd
    - Redémarrer llama-server

- name: S'assurer que llama-server est démarré et actif au boot
  ansible.builtin.systemd:
    name: llama-server
    state: started
    enabled: true

