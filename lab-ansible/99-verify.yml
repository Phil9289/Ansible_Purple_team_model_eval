---
- name: Validation et Preuve de Sécurité de l'Isolation du Lab Purple Team
  hosts: attacker
  gather_facts: false
  vars:
    # Toutes les adresses viennent de l'inventaire : rien n'est écrit en dur.
    target_ip: "{{ hostvars[groups['web'][0]]['ansible_host'] }}"
    target_port: "{{ hostvars[groups['web'][0]]['nginx_listen_port'] }}"
    logs_ip: "{{ hostvars[groups['logs'][0]]['ansible_host'] }}"
    pve_ip: "{{ hostvars[groups['proxmox_host'][0]]['ansible_host'] }}"
  tasks:
    # --- Tests Positifs (Flux autorisés indispensables au fonctionnement) ---
    - name: "[POSITIF] 1. Vérifier l'accès HTTP à la cible vulnérable ({{ target_ip }}:{{ target_port }})"
      ansible.builtin.uri:
        url: "http://{{ target_ip }}:{{ target_port }}/"
        method: GET
        status_code: 200
        timeout: 5
      register: test_web

    - name: "[POSITIF] 2. Vérifier la connectivité Syslog TCP/514 vers le serveur de logs ({{ logs_ip }})"
      ansible.builtin.command:
        cmd: "nc -z -w 3 {{ logs_ip }} 514"
      register: test_logs
      changed_when: false

    - name: "[POSITIF] 3. Vérifier la santé du moteur d'inférence LLM local (127.0.0.1:{{ llama_port }})"
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ llama_port }}/health"
        method: GET
        status_code: 200
        timeout: 5
      register: test_llm

    # --- Tests Négatifs (Flux interdits qui DOIVENT échouer en mode isolé) ---
    - name: "[NÉGATIF] 4. Tester l'accès à Internet ({{ lab_internet_probe_ip }}) — DOIT ÊTRE REJETÉ"
      ansible.builtin.command:
        cmd: "curl -s -m 3 http://{{ lab_internet_probe_ip }}"
      register: test_internet
      changed_when: false
      ignore_errors: true

    - name: "[NÉGATIF] 5. Tester l'accès au réseau local domestique ({{ lab_lan_probe_ip }}) — DOIT ÊTRE REJETÉ"
      ansible.builtin.command:
        cmd: "curl -s -m 3 http://{{ lab_lan_probe_ip }}"
      register: test_lan
      changed_when: false
      ignore_errors: true

    - name: "[NÉGATIF] 6. Tester l'accès à l'interface d'administration Proxmox ({{ pve_ip }}:8006) — DOIT ÊTRE REJETÉ"
      ansible.builtin.command:
        cmd: "curl -k -s -m 3 https://{{ pve_ip }}:8006"
      register: test_pve
      changed_when: false
      ignore_errors: true

    - name: "[NÉGATIF] 7. Tester une connexion SSH clandestine vers le serveur de logs ({{ logs_ip }}:22) — DOIT ÊTRE BLOQUÉE"
      ansible.builtin.command:
        cmd: "nc -z -w 3 {{ logs_ip }} 22"
      register: test_ssh_logs
      changed_when: false
      ignore_errors: true

    # --- Assertion Finale et Preuve Académique ---
    - name: "Vérifier la conformité stricte de l'isolation du laboratoire"
      ansible.builtin.assert:
        that:
          - test_web.status == 200
          - test_logs.rc == 0
          - test_llm.status == 200
          - test_internet.rc != 0
          - test_lan.rc != 0
          - test_pve.rc != 0
          - test_ssh_logs.rc != 0
        success_msg: "SUCCÈS TOTAL : Tous les flux autorisés sont opérationnels et tous les flux interdits sont strictement bloqués par nftables !"
        fail_msg: "ALERTE SÉCURITÉ : Un flux interdit n'a pas été rejeté comme prévu."
