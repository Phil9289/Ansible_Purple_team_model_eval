all:
  vars:
    ansible_python_interpreter: /usr/bin/python3
  children:
    proxmox_host:
      hosts:
        pve:
          ansible_host: 192.168.1.116
    lab:
      vars:
        ansible_user: ansible
        ansible_ssh_private_key_file: /root/.ssh/id_ed25519
      children:
        attacker:
          hosts:
            agent:
              ansible_host: 10.30.0.10
        web:
          hosts:
            target:
              ansible_host: 10.30.0.20
        logs:
          hosts:
            logging:
              ansible_host: 10.30.0.30
